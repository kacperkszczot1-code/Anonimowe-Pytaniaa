<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Odkryj swoje pytanie</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 30px;
}

.kafelek {
  width: 90%;
  max-width: 600px;
  padding: 30px;
  margin: 15px auto;
  background: #3498db;
  color: white;
  border-radius: 12px;
  cursor: pointer;
  font-size: 22px;
  transition: background 0.3s, transform 0.2s;
}

.kafelek:hover {
  background: #2980b9;
  transform: scale(1.02);
}

.kafelek.zablokowany {
  background: #7f8c8d;
  cursor: not-allowed;
  pointer-events: none;
  transform: none;
}
</style>
</head>

<body>

<h2 id="naglowek">Możesz odkryć tylko jedno pytanie.</h2>

<div class="kafelek" data-id="1" data-question="Gdybyś miała/miał opisać te 4 lata jednym słowem – jakie by to było i dlaczego?">???</div>
<div class="kafelek" data-id="2" data-question="Jak to się zaczęło i dlaczego się zaczęło?">???</div>
<div class="kafelek" data-id="3" data-question="Jak zmieniło się Twoje podejście do ludzi przez te 4 lata?">???</div>
<div class="kafelek" data-id="4" data-question="Kto z tej grupy najbardziej Cię zaskoczył przez te lata?">???</div>
<div class="kafelek" data-id="5" data-question="Jaki moment chciałabyś/chciałbyś przeżyć jeszcze raz dokładnie tak samo?">???</div>
<div class="kafelek" data-id="6" data-question="A jaki moment był najtrudniejszy?">???</div>
<div class="kafelek" data-id="7" data-question="Czego nauczyły Cię te 4 lata, jakiej cechy?">???</div>
<div class="kafelek" data-id="8" data-question="Co będzie Ci najbardziej brakowało po liceum?">???</div>
<div class="kafelek" data-id="9" data-question="Jak myślisz – czy za 10 lat dalej będziemy się znać? W jakiej formie?">???</div>

<script>
const kafelki = document.querySelectorAll('.kafelek');
const naglowek = document.getElementById('naglowek');

const TERAZ = Date.now();
const MINUTA = 60 * 1000;
const CZTERY_GODZINY = 4 * 60 * 60 * 1000;

// ====== LIMIT 1 MINUTY NA STRONIE ======
let startSesji = localStorage.getItem('startSesji');

if (!startSesji) {
  localStorage.setItem('startSesji', TERAZ);
  startSesji = TERAZ;
}

if (TERAZ - startSesji >= MINUTA) {
  zablokujStrone("Czas minął. Wróć później ⏳");
} else {
  setTimeout(() => {
    zablokujStrone("Czas minął. Wróć później ⏳");
  }, MINUTA - (TERAZ - startSesji));
}

// ====== JEDNO PYTANIE NA 4 GODZINY ======
const zapis = JSON.parse(localStorage.getItem('dailyQuestion'));

if (zapis && TERAZ - zapis.time < CZTERY_GODZINY) {
  kafelki.forEach(k => {
    if (k.dataset.id === zapis.id) {
      k.textContent = k.dataset.question;
    } else {
      k.textContent = "🔒 Zamknięte (spróbuj później)";
    }
    k.classList.add('zablokowany');
  });
} else {
  localStorage.removeItem('dailyQuestion');
}

// ====== KLIKNIĘCIE KAFELKA ======
kafelki.forEach(k => {
  k.addEventListener('click', () => {
    if (!localStorage.getItem('dailyQuestion')) {
      localStorage.setItem(
        'dailyQuestion',
        JSON.stringify({
          id: k.dataset.id,
          time: Date.now()
        })
      );

      kafelki.forEach(other => {
        if (other === k) {
          other.textContent = other.dataset.question;
        } else {
          other.textContent = "🔒 Zamknięte (spróbuj później)";
        }
        other.classList.add('zablokowany');
      });
    }
  });
});

// ====== FUNKCJA BLOKUJĄCA STRONĘ ======
function zablokujStrone(tekst) {
  naglowek.textContent = tekst;
  kafelki.forEach(k => {
    k.classList.add('zablokowany');
  });
}
</script>

</body>
</html>
