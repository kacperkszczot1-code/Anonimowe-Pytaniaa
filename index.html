<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Losowy link</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 60px;
  }
  .counter {
    margin-top: 20px;
    font-size: 16px;
    color: #555;
  }
</style>
</head>
<body>

<h1>Przekierowujemy Cię dalej…</h1>
<p id="status"></p>
<div class="counter" id="counter"></div>

<script>
  // 🔹 Twoje linki do Privnote (nowy link jako pierwszy)
  const ALL_LINKS = [
    "https://privnote.com/VFlptO7G#KRIIbMJMa",
    "https://privnote.com/dwpikTlV#2rso1ZssH",
    "https://privnote.com/VwSqZf0U#8kzgIKAAY",
    "https://privnote.com/PyDv5LPm#f0QfZYQOa",
    "https://privnote.com/YoSJuPFv#ju319yX2f",
    "https://privnote.com/Kj6bZ61x#OQK792Xfw",
    "https://privnote.com/N0QJ16nf#l7lFYulII",
    "https://privnote.com/0ww8h5WH#DMlYBZ1vh",
    "https://privnote.com/HTU14mlc#1myhqTU7c",
    "https://privnote.com/PUz3DMpE#Xe8ILEtBj"
  ];

  const STORAGE_KEY = "unused_links";

  // jeśli pierwsze wejście, zapisujemy wszystkie linki
  if (!localStorage.getItem(STORAGE_KEY)) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(ALL_LINKS));
  }

  let unusedLinks = JSON.parse(localStorage.getItem(STORAGE_KEY));

  const statusEl = document.getElementById("status");
  const counterEl = document.getElementById("counter");

  if (unusedLinks.length === 0) {
    statusEl.textContent = "Brak dostępnych linków.";
    counterEl.textContent = "Pozostało: 0";
  } else {
    // Losowanie linku
    const index = Math.floor(Math.random() * unusedLinks.length);
    const chosenLink = unusedLinks[index];

    // Usuń użyty link
    unusedLinks.splice(index, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(unusedLinks));

    counterEl.textContent = "Pozostało linków: " + unusedLinks.length;

    // Automatyczne przekierowanie po 1,5 sekundy
    setTimeout(() => {
      window.location.href = chosenLink;
    }, 1500);
  }
</script>

</body>
</html>
