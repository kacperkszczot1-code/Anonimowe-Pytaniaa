<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Odkryj jedno pytanie</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #fff;
  text-align: center;
}

h1 {
  margin-top: 40px;
}

.grid {
  max-width: 900px;
  margin: 50px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 20px;
}

.tile {
  background: #1e1e1e;
  border-radius: 14px;
  padding: 50px 10px;
  font-size: 28px;
  cursor: pointer;
  transition: 0.2s;
  user-select: none;
}

.tile:hover {
  background: #2a2a2a;
  transform: scale(1.05);
}
</style>
</head>

<body>

<h1>Możesz odkryć tylko jeden kafelek</h1>
<p>Z jednego IP tylko jedno pytanie</p>

<div class="grid">
  <div class="tile" onclick="reveal(1)">?</div>
  <div class="tile" onclick="reveal(2)">?</div>
  <div class="tile" onclick="reveal(3)">?</div>
  <div class="tile" onclick="reveal(4)">?</div>
  <div class="tile" onclick="reveal(5)">?</div>
  <div class="tile" onclick="reveal(6)">?</div>
  <div class="tile" onclick="reveal(7)">?</div>
  <div class="tile" onclick="reveal(8)">?</div>
  <div class="tile" onclick="reveal(9)">?</div>
  <div class="tile" onclick="reveal(10)">?</div>
</div>

<script>
function reveal(id) {
  fetch("https://TWOJ-WORKER.cloudflareworkers.dev/reveal?id=" + id)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        alert(data.error)
      } else {
        alert(data.question)
        window.location.href = data.redirect
      }
    })
}
</script>

</body>
</html>
